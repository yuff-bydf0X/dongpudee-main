{% extends "base.html" %}
{% block content %}
<section class="panel auth-box">
  <h1>{{ headline }}</h1>
  <p class="lead">{{ subtext }}</p>

  <form method="post" class="auth-form">
    <div class="field-row">
      <div class="field">
        <label>ชื่อ-นามสกุล</label>
        <input type="text" name="full_name" placeholder="สมชาย ใจดี" required>
      </div>
      <div class="field">
        <label>เบอร์โทร</label>
        <input type="text" name="phone" placeholder="0812345678">
      </div>
    </div>

    <div class="field">
      <label>อีเมล</label>
      <input type="email" name="email" placeholder="you@example.com" required>
    </div>

    <div class="field">
      <label>รหัสผ่าน</label>
      <input type="password" name="password" placeholder="อย่างน้อย 6 ตัว" required>
    </div>

    <div class="field">
      <label>ที่อยู่</label>
      <textarea name="address" rows="3" placeholder="123/45 หมู่ 7"></textarea>
    </div>

    <div class="field-row">
      <div class="field">
        <label>อำเภอ/เขต</label>
        <input type="text" name="district" placeholder="เมือง">
      </div>
      <div class="field">
        <label>จังหวัด</label>
        <input type="text" name="province" placeholder="อุบลราชธานี">
      </div>
      <div class="field">
        <label>รหัสไปรษณีย์</label>
        <input type="text" name="postal_code" placeholder="34000">
      </div>
    </div>

    <button type="submit" class="btn full">สร้างบัญชี</button>
    <p class="note">มีบัญชีแล้ว? <a href="/signin">เข้าสู่ระบบ</a></p>
  </form>
</section>
{% endblock %}
